server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: SEATA_GROUP
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
        - id: storage-service-route
          uri: lb://storage-service
          predicates:
            - Path=/api/storage/**
        - id: account-service-route
          uri: lb://account-service
          predicates:
            - Path=/api/account/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. 訂單微服務 (Order Service)
        url: /api/order/v3/api-docs
      - name: 2. 庫存微服務 (Storage Service)
        url: /api/storage/v3/api-docs
      - name: 3. 帳戶微服務 (Account Service)
        url: /api/account/v3/api-docs
